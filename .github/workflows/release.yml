# Publishes to npm when a version tag (v1.2.3) is pushed, with npm trusted
# publishing (OIDC): no token is stored in the repository.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public --provenance
      - name: GitHub release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          printf '\nnpm: https://www.npmjs.com/package/arabic-pdf-repair/v/%s\n' "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md --verify-tag
